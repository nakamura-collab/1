<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X 自動投稿アプリ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- ヘッダー -->
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <svg class="x-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622 5.912-5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          <span>自動投稿アプリ</span>
        </div>
        <button class="btn btn-icon" id="settingsBtn" title="API設定">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06-.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="main">
      <!-- 認証情報バナー -->
      <div class="banner banner-warn" id="credentialsBanner" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        X API の認証情報が設定されていません。
        <button class="link-btn" id="openSettingsFromBanner">今すぐ設定する →</button>
      </div>

      <!-- 投稿フォーム -->
      <section class="compose-card">
        <h2 class="section-title">投稿を作成</h2>
        <div class="compose-body">
          <textarea
            id="postContent"
            class="compose-textarea"
            placeholder="いまどうしてる？（最大280文字）"
          ></textarea>
          <div class="compose-footer">
            <div class="compose-meta">
              <div class="char-wrap">
                <svg class="char-ring" viewBox="0 0 36 36">
                  <circle class="ring-bg" cx="18" cy="18" r="15"/>
                  <circle class="ring-fill" id="charRing" cx="18" cy="18" r="15"
                    stroke-dasharray="94.2 94.2" stroke-dashoffset="94.2"/>
                </svg>
                <span class="char-count" id="charCount">0</span>
              </div>
              <span class="char-max">/ 280</span>
            </div>
            <div class="compose-actions">
              <label class="schedule-toggle">
                <input type="checkbox" id="scheduleToggle" />
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                  <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                スケジュール投稿
              </label>
              <div class="schedule-inputs" id="scheduleInputs" style="display:none">
                <input type="datetime-local" id="scheduledAt" class="input-datetime" />
              </div>
              <button class="btn btn-primary" id="postBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                  <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
                今すぐ投稿
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- トースト通知 -->
      <div class="toast" id="toast"></div>

      <!-- 投稿一覧 -->
      <section class="posts-section">
        <div class="tabs">
          <button class="tab active" data-tab="scheduled">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            スケジュール済み
            <span class="tab-badge" id="badgeScheduled" style="display:none">0</span>
          </button>
          <button class="tab" data-tab="posted">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            投稿済み
          </button>
          <button class="tab" data-tab="other">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
              <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/>
              <line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
            失敗 / キャンセル
          </button>
        </div>

        <div class="tab-content" id="tabScheduled">
          <div class="post-list" id="listScheduled"></div>
          <p class="empty-msg" id="emptyScheduled" style="display:none">スケジュール済みの投稿はありません</p>
        </div>
        <div class="tab-content hidden" id="tabPosted">
          <div class="post-list" id="listPosted"></div>
          <p class="empty-msg" id="emptyPosted" style="display:none">投稿済みの記録はありません</p>
        </div>
        <div class="tab-content hidden" id="tabOther">
          <div class="post-list" id="listOther"></div>
          <p class="empty-msg" id="emptyOther" style="display:none">失敗・キャンセルの記録はありません</p>
        </div>
      </section>
    </main>
  </div>

  <!-- API設定モーダル -->
  <div class="modal-overlay" id="settingsModal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3>X API 認証設定</h3>
        <button class="btn btn-icon" id="closeModal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">
          <a href="https://developer.x.com/en/portal/dashboard" target="_blank" rel="noopener">X Developer Portal</a>
          でアプリを作成し、以下の認証情報を入力してください。
        </p>
        <div class="form-group">
          <label>API Key (Consumer Key)</label>
          <input type="password" id="apiKey" class="input" placeholder="xxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off" />
        </div>
        <div class="form-group">
          <label>API Secret (Consumer Secret)</label>
          <input type="password" id="apiSecret" class="input" placeholder="xxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off" />
        </div>
        <div class="form-group">
          <label>Access Token</label>
          <input type="password" id="accessToken" class="input" placeholder="xxxxxxxx-xxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off" />
        </div>
        <div class="form-group">
          <label>Access Token Secret</label>
          <input type="password" id="accessSecret" class="input" placeholder="xxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off" />
        </div>
        <div class="modal-status" id="modalStatus"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="testCredBtn">接続テスト</button>
        <button class="btn btn-primary" id="saveCredBtn">保存</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
